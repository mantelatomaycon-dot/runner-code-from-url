<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Execute Code</title>
</head>
<body>
<script>
(function() {
  const s = window.location.search;
  const m = s.match(/execute\?code=(.*)$/);
  if (!m) return;
  try {
    document.open();
    document.write(decodeURIComponent(m[1]));
    document.close();
  } catch {}
})();
</script>
</body>
</html>
