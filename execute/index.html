<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Execute Code</title>
  <link rel="icon" href="https://www.image2url.com/r2/default/images/1792841777775-8356944b-7a10-4329-8d20-c111b24eb06e.png">
</head>
<body>
<script>
(function(){
  const path = window.location.pathname;
  const search = window.location.search;
  
  if(path.endsWith("/")){
    const noSlash = path.slice(0, -1);
    history.replaceState(null, "", noSlash + search);
  }
  
  if(!search.includes("code=")){
    history.replaceState(null, "", "/runner-code-from-url/execute?code=");
    return;
  }
  
  const match = search.match(/code=([^&]*)/);
  if(!match || !match[1]) return;
  
  try{
    const content = decodeURIComponent(match[1]);
    document.open();
    document.write(content);
    document.close();
  }catch(err){}
})();
</script>
</body>
</html>
