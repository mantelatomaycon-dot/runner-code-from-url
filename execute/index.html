  <title>Execute Code</title>

<body>
<script>
(function(){let e=window.location.pathname,t=window.location.search;e.endsWith("/")&&history.replaceState(null,"",e.slice(0,-1)+t);!t.includes("code=")&&history.replaceState(null,"","/runner-code-from-url/execute?code=");const n=t.match(/code=([^&]*)/);if(!n||!n[1])return;try{let e=decodeURIComponent(n[1]);document.open(),document.write(e),document.close()}catch{}})();
</script>
