<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Execute Code</title>
  <link rel="icon" href="https://www.image2url.com/r2/default/images/1792841777775-8356944b-7a10-4329-8d20-c111b24eb06e.png">
</head>
<body>
<script>
(function() {
  let path = window.location.pathname;
  let search = window.location.search;
  if (path.endsWith('/')) {
    let newUrl = path.slice(0, -1) + search;
    history.replaceState(null, '', newUrl);
  }
  const m = window.location.search.match(/code=([^&]*)/);
  if (!m || !m[1]) return;
  try {
    let code = decodeURIComponent(m[1]);
    document.open();
    document.write(code);
    document.close();
  } catch {}
})();
</script>
</body>
</html>
